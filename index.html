<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
"use strict";
const {useState,useEffect,useRef,useCallback,useMemo} = React;
function cssObj(str){const o={};String(str).split(";").forEach(d=>{const i=d.indexOf(":");if(i<1)return;const k=d.slice(0,i).trim(),v=d.slice(i+1).trim();if(!k)return;o[k.startsWith("--")?k:k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=v});return o}
function h(type,props,...children){if(props&&typeof props.style==="string")props={...props,style:cssObj(props.style)};return React.createElement(type,props,...children)}
const html = htm.bind(h);

/* ------------------------------------------------------------------ constants */
const ROLES = [
  ["empty_plot","Boş arsa"],["construction_front","Şantiye (ön)"],["construction_aerial","Şantiye (havadan)"],
  ["aerial","Havadan / konum"],["render_3d","3D mimari görsel"],["floor_plan","Kat planı"],["other","Diğer"]];
const ROLE_LABEL = Object.fromEntries(ROLES);
const STAGE_SETS = {
  empty_plot: [
    ["empty","Boş arsa","The plot is empty: flat dirt and dry grass, survey stakes and string lines marking the footprint."],
    ["excavation","Hafriyat","Excavation: an excavator digs the footprint, a dump truck is loaded, piles of soil."],
    ["foundation","Temel","Foundation: rebar grid and formwork, a concrete mixer pours the raft foundation."],
    ["frame","Betonarme karkas","Reinforced concrete columns and slabs rise floor by floor, timber shoring, tower crane."],
    ["walls_roof","Duvar ve çatı","Brick infill walls, empty window openings, roof built, scaffolding around."],
    ["facade","Cephe ve pencere","Plaster and cladding applied, windows installed, scaffolding partly removed."],
    ["landscape","Bahçe ve çevre","Facade finished, lawn and trees planted, walkway and parking paved."],
    ["done","Tamamlandı","Finished building, clean site, warm exterior lights."]],
  ongoing_construction: [
    ["today","Bugün (gerçek fotoğraf)",""],
    ["rough","Kaba inşaat tamamlanıyor","Remaining brick infill completed, roof structure built on top, workers on site."],
    ["roof_scaffold","Çatı ve iskele","Roof covered, full scaffolding with safety nets around the facade."],
    ["plaster","Sıva","Plaster applied across the facade from top to bottom, scaffolding in place."],
    ["windows","Doğrama ve korkuluk","Windows installed in every existing opening, balcony railings mounted, scaffolding partly removed."],
    ["landscape","Çevre düzenlemesi","Scaffolding removed, debris cleared, lawn, fence and garden lights installed."],
    ["done","Anahtar teslim","Finished building matching the architect's 3D design, clean site, warm lights."]]
};
const KEEP_BLOCK = {
  empty_plot: "Use the uploaded reference image (the finished design). Keep EXACTLY the same camera position, angle, lens, framing, plot boundaries, surroundings, lighting and building geometry. Only change the construction stage as described. Ultra photorealistic, natural daylight.",
  ongoing_construction: "Use reference image 1 (the real construction photo) as the base. Keep EXACTLY the same camera position, angle, framing, neighboring buildings and lighting. Keep the floor count, floor heights, column grid, window and balcony openings exactly as in reference image 1. Match the finished design in reference image 2 (architect's 3D render). Only change the construction progress as described. Ultra photorealistic, natural daylight."
};
const VIDEO_PROMPT = "Construction timelapse, locked-off static camera, no camera movement. Fast-forward: workers and machines moving quickly, shadows sweeping, clouds moving fast. The building progresses gradually and continuously from the first frame to the last frame; nothing appears suddenly. Keep geometry identical. Photorealistic.";

const STATUS = {
  real:["ok","Gerçek fotoğraf"], render:["info","Mimar 3D görseli (farklı açı)"], generated:["info","AI ile üretildi"], external:["info","Dışarıdan yüklendi"],
  planned:["", "Planlandı, görsel yok"], failed:["bad","Üretilemedi"]
};

function uid(){return Math.random().toString(36).slice(2,10)}
function slug(s){return (s||"proje").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"proje"}
function fmtTL(n){if(n==null||n==="")return "";return "₺"+Number(n).toLocaleString("tr-TR")}
function stagesFor(type){return STAGE_SETS[type].map(([key,title,desc])=>({key,title,desc,status:"planned",media:null}))}
function normalize(x){
  const type=x.type==="empty_plot"?"empty_plot":"ongoing_construction";
  const base={aiClips:[],aiFilmSeconds:60,aiTest:null,name:"Adsız proje",status:"",createdAt:"",location:"",plotM2:"",floors:{value:"",confirmed:false},unitsTotal:"",units:[],delivery:"",phone:"",brand:"",claims:[],photos:[],analysis:null,outputs:[]};
  const p={...base,...x,type};
  p.floors={value:"",confirmed:false,...(x.floors||{})};
  for(const k of ["units","claims","photos","outputs","aiClips"])if(!Array.isArray(p[k]))p[k]=[];
  if(!Array.isArray(p.stages)||!p.stages.length)p.stages=stagesFor(type);
  return p;
}
function newProject(name,type){
  return {id:slug(name)+"-"+uid().slice(0,4),name,type,status:"Bilgi bekleniyor",createdAt:new Date().toISOString(),
    location:"",plotM2:"",floors:{value:"",confirmed:false},unitsTotal:"",units:[],delivery:"",phone:"",brand:"",
    claims:[],photos:[],analysis:null,stages:stagesFor(type),outputs:[]};
}

/* ------------------------------------------------------------------ storage: claude.ai (db + assets) or device (IndexedDB) */
const Store = (()=>{
  let mode="loading", db=null, assets=null, downloads=null, sample=null, idb=null;
  const listeners=new Set();
  function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("buildvision",1);r.onupgradeneeded=()=>{r.result.createObjectStore("projects",{keyPath:"id"});r.result.createObjectStore("blobs")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  function tx(store,m,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,m);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
  const blobUrls={};
  async function init(){
    const c = window.claude;
    if(c && c.use){
      try{
        [db,assets,downloads,sample] = await Promise.all([c.use("db"),c.use("assets"),c.use("downloads"),c.use("sample")]);
      }catch(e){}
    }
    if(db){mode="cloud";}
    else{
      try{idb=await idbOpen();mode="device"}catch(e){mode="memory"}
    }
    return mode;
  }
  const mem={projects:{},blobs:{}};
  function subscribe(cb){
    if(mode==="cloud"){
      return db.collection("projects").onSnapshot(s=>cb(s.docs.map(d=>normalize({...d.data(),id:d.id}))), e=>cb(null,e));
    }
    const fire=async()=>{let list=[];if(mode==="device"){list=await tx("projects","readonly",s=>s.getAll())}else list=Object.values(mem.projects);cb((list||[]).map(normalize))};
    listeners.add(fire);fire();return ()=>listeners.delete(fire);
  }
  async function save(p){
    const clean=JSON.parse(JSON.stringify(p));
    if(mode==="cloud"){const {id,...rest}=clean;await db.doc("projects/"+id).set(rest);return}
    if(mode==="device")await tx("projects","readwrite",s=>s.put(clean));else mem.projects[p.id]=clean;
    listeners.forEach(f=>f());
  }
  async function remove(id){
    if(mode==="cloud"){await db.doc("projects/"+id).delete();return}
    if(mode==="device")await tx("projects","readwrite",s=>s.delete(id));else delete mem.projects[id];
    listeners.forEach(f=>f());
  }
  async function putBlob(blob){
    if(mode==="cloud"){
      if(!assets) throw {code:"not_granted",message:"Bu görünümde dosya yükleme izni yok."};
      const r=await assets.upload(blob,{type:blob.type||"image/jpeg"});return r.id;
    }
    const id=uid()+uid();
    if(mode==="device")await tx("blobs","readwrite",s=>s.put(blob,id));else mem.blobs[id]=blob;
    return id;
  }
  function url(id){
    if(!id)return "";
    if(mode==="cloud")return "/_blob/"+id;
    return blobUrls[id]||"";
  }
  async function resolveUrl(id){
    if(!id)return "";
    if(mode==="cloud")return "/_blob/"+id;
    if(blobUrls[id])return blobUrls[id];
    let b = mode==="device"? await tx("blobs","readonly",s=>s.get(id)) : mem.blobs[id];
    if(!b)return "";
    blobUrls[id]=URL.createObjectURL(b);return blobUrls[id];
  }
  async function getBlob(id){
    if(mode==="cloud"){const r=await fetch("/_blob/"+id);return await r.blob()}
    return mode==="device"? await tx("blobs","readonly",s=>s.get(id)) : mem.blobs[id];
  }
  async function saveFile(blob,filename){
    if(downloads){return downloads.save({filename,data:blob})}
    const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return {status:"shared"}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();return {status:"saved"};
  }
  async function importProjectZip(file,onStep){
    onStep&&onStep("ZIP okunuyor");
    const entries=await readZip(file);
    const jsonName=Object.keys(entries).find(n=>/\.json$/i.test(n)&&!n.startsWith("__MACOSX"));
    if(!jsonName)throw new Error("ZIP içinde proje bilgisi (.json) bulunamadı. Doğru dosyayı seçtiğinizden emin olun.");
    let doc;try{doc=JSON.parse(new TextDecoder().decode(await entries[jsonName]()))}catch(e){throw new Error("Proje bilgisi okunamadı.")}
    if(!doc||!doc.project||!Array.isArray(doc.files))throw new Error("Bu ZIP bir BuildVision proje dosyası değil.");
    const map={};let n=0;
    for(const f of doc.files){
      const key=Object.keys(entries).find(k=>k===f.file||k.endsWith("/"+f.file));
      if(!key)throw new Error("ZIP içinde eksik dosya: "+f.file);
      onStep&&onStep(`Dosyalar kaydediliyor (${++n}/${doc.files.length})`);
      const type=/\.mp4$/i.test(f.file)?"video/mp4":/\.png$/i.test(f.file)?"image/png":"image/jpeg";
      map[f.file]=await putBlob(new Blob([await entries[key]()],{type}));
    }
    const ref=v=>v&&map[v]?map[v]:v;
    const p=doc.project;
    p.photos=(p.photos||[]).map(ph=>({...ph,id:ref(ph.id)}));
    p.stages=(p.stages||[]).map(st=>({...st,media:ref(st.media)}));
    p.outputs=(p.outputs||[]).map(o=>({...o,id:ref(o.id)}));
    let id=doc.id||slug(p.name);
    const existing=await new Promise(r=>{const un=subscribe(list=>{r(list||[]);setTimeout(()=>un&&un(),0)})});
    if(existing.some(x=>x.id===id))id=id+"-"+uid().slice(0,4);
    await save(normalize({...p,id}));
    return {id,files:n};
  }
  return {init,subscribe,save,remove,importProjectZip,putBlob,url,resolveUrl,getBlob,saveFile,get mode(){return mode},get sample(){return sample},get canUpload(){return mode!=="cloud"||!!assets},get canDownload(){return !!downloads||mode!=="cloud"}};
})();

/* external network reachability: blocked inside claude.ai artifacts by its security policy */
const IN_CLAUDE = !!(window.claude && window.claude.use);
/* minimal ZIP reader: stored (method 0) and deflate (method 8, via DecompressionStream) */
async function readZip(file){
  const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer);
  let eocd=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error("Dosya geçerli bir ZIP değil.");
  const count=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const out={};
  for(let k=0;k<count;k++){
    if(dv.getUint32(off,true)!==0x02014b50)throw new Error("ZIP dizini bozuk.");
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),xlen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),loff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46,off+46+nlen));
    off+=46+nlen+xlen+clen;
    if(name.endsWith("/"))continue;
    const ln=dv.getUint16(loff+26,true),lx=dv.getUint16(loff+28,true);const start=loff+30+ln+lx;const data=buf.subarray(start,start+csize);
    out[name]=async()=>{
      if(method===0)return data.slice();
      if(method===8){if(typeof DecompressionStream==="undefined")throw new Error("Bu cihaz sıkıştırılmış ZIP açamıyor. iOS’u güncelleyin.");
        const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return new Uint8Array(await new Response(ds).arrayBuffer())}
      throw new Error("Desteklenmeyen ZIP sıkıştırması: "+method);
    };
  }
  return out;
}

/* ------------------------------------------------------------------ image helpers */
async function downscale(file,max=1600){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,"image/jpeg",0.86));
  }finally{URL.revokeObjectURL(url)}
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=src})}

/* ------------------------------------------------------------------ prompts */
function buildPrompts(p){
  const facts=[];
  if(p.floors.value)facts.push(`Building: ${p.floors.value}${p.floors.confirmed?"":" (unconfirmed)"}.`);
  if(p.plotM2)facts.push(`Plot area ${p.plotM2} m².`);
  const master = p.type==="empty_plot"
    ? `Ultra photorealistic architectural visualization. A finished residential building on a ${p.plotM2||"?"} m² plot${p.floors.value?`, ${p.floors.value}`:""}. Use the uploaded empty plot photo for the exact camera angle and surroundings. Natural daylight, cinematic, 4K.`
    : `${KEEP_BLOCK.ongoing_construction}\nThe same building finished: final facade, windows in the existing openings, roof completed as in the 3D render, landscaped garden, clean site.`;
  return {master, stages:p.stages.map(s=>({key:s.key,image: s.key==="today"?"(gerçek fotoğraf — üretim gerekmez)": `${KEEP_BLOCK[p.type]}\n${facts.join(" ")}\n${s.desc}`})),
    video: p.stages.slice(1).map((s,i)=>`${VIDEO_PROMPT}\nStart frame: ${p.stages[i].title}. End frame: ${s.title}. ${s.desc}`)};
}
function localPlan(p){
  const has=r=>p.photos.filter(x=>x.role===r).length;
  const lines=[];
  lines.push(`Proje türü: ${p.type==="empty_plot"?"Boş arsa":"Devam eden inşaat"}`);
  lines.push(`Fotoğraflar: ${p.photos.length} adet (boş arsa ${has("empty_plot")}, şantiye ön ${has("construction_front")}, havadan ${has("construction_aerial")+has("aerial")}, 3D ${has("render_3d")}, plan ${has("floor_plan")}).`);
  if(p.type==="ongoing_construction"){
    if(!has("construction_front"))lines.push("Eksik: sabit kamera için ön cepheden gerçek şantiye fotoğrafı.");
    if(!has("render_3d"))lines.push("Eksik: tamamlanmış tasarımın kaynağı olacak 3D mimari görsel.");
    lines.push("Kural: kat sayısı, pencere ve balkon açıklıkları, konum ve kamera açısı gerçek fotoğraftan alınır, değiştirilmez.");
  }else{
    if(!has("empty_plot"))lines.push("Eksik: kamera açısını belirleyecek boş arsa fotoğrafı.");
    if(!p.plotM2)lines.push("Eksik: arsa metrekaresi.");
  }
  if(!p.floors.confirmed)lines.push(`Kat sayısı: ${p.floors.value||"girilmedi"} — onay bekliyor.`);
  return lines.join("\n");
}

/* ------------------------------------------------------------------ local video composer (canvas + MediaRecorder) */
function pickMime(){
  const c=["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  if(!window.MediaRecorder)return null;
  return c.find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||null;
}
async function composeVideo(p,{vertical,seconds,showPrices},onProgress){
  const mime=pickMime();
  if(!mime)throw new Error("Bu tarayıcı video kaydını desteklemiyor (MediaRecorder yok).");
  const W=vertical?720:1280,H=vertical?1280:720;
  const frames=[];
  for(const s of p.stages){if(s.media){const u=await Store.resolveUrl(s.media);if(u){try{frames.push({img:await loadImg(u),title:s.title,status:s.status})}catch(e){}}}}
  if(frames.length<2){
    const pics=p.photos.filter(x=>x.role!=="floor_plan");
    for(const ph of pics){const u=await Store.resolveUrl(ph.id);if(u){try{frames.push({img:await loadImg(u),title:ROLE_LABEL[ph.role]||"",status:"real"})}catch(e){}}}
  }
  if(!frames.length)throw new Error("Videoya konacak görsel yok. Önce fotoğraf yükleyin veya aşamalara görsel atayın.");
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const stream=c.captureStream(30);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5_000_000});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  const css=getComputedStyle(document.documentElement);
  const ACC=css.getPropertyValue("--accent").trim()||"#e8661c";
  const endCard=2.6, body=seconds-endCard, per=body/frames.length, xf=.6;
  function cover(img,z,cx,cy){const r=Math.max(W/img.width,H/img.height)*z;const w=img.width*r,h=img.height*r;g.drawImage(img,W/2-w*cx,H/2-h*cy,w,h)}
  function txt(s,x,y,size,col,weight=800,align="left"){g.font=`${weight} ${size}px Archivo, Helvetica, Arial, sans-serif`;g.textAlign=align;g.fillStyle="rgba(0,0,0,.45)";g.fillText(s,x+2,y+3);g.fillStyle=col;g.fillText(s,x,y)}
  rec.start(250);
  const t0=performance.now();
  await new Promise(resolve=>{
    function draw(){
      const t=(performance.now()-t0)/1000;
      g.fillStyle="#111";g.fillRect(0,0,W,H);
      if(t<body){
        const k=Math.min(frames.length-1,Math.floor(t/per)),u=(t-k*per)/per;
        g.globalAlpha=1;cover(frames[k].img,1+.08*u,.5,.5);
        if(k+1<frames.length&&u>1-xf/per){g.globalAlpha=(u-(1-xf/per))/(xf/per);cover(frames[k+1].img,1,.5,.5);g.globalAlpha=1}
        const grd=g.createLinearGradient(0,H*.55,0,H);grd.addColorStop(0,"rgba(0,0,0,0)");grd.addColorStop(1,"rgba(0,0,0,.75)");g.fillStyle=grd;g.fillRect(0,H*.55,W,H*.45);
        const pad=vertical?48:64;
        txt(`${String(k+1).padStart(2,"0")} / ${String(frames.length).padStart(2,"0")}`,pad,H-(vertical?250:170),vertical?26:24,ACC,600);
        txt(frames[k].title,pad,H-(vertical?200:120),vertical?52:56,"#fff");
        if(frames[k].status==="generated")txt("AI görseli",W-pad,vertical?120:70,22,"#fff",600,"right");
        // progress bar
        g.fillStyle="rgba(255,255,255,.25)";g.fillRect(pad,H-(vertical?150:80),W-2*pad,6);g.fillStyle=ACC;g.fillRect(pad,H-(vertical?150:80),(W-2*pad)*Math.min(1,t/body),6);
        if(t<2.4){g.globalAlpha=Math.max(0,1-Math.max(0,t-1.8)/.6);txt(p.name,pad,vertical?220:120,vertical?58:62,"#fff");if(p.location)txt(p.location,pad,vertical?270:165,vertical?28:28,"#fff",600);g.globalAlpha=1}
      }else{
        g.fillStyle="#141517";g.fillRect(0,0,W,H);
        const a=Math.min(1,(t-body)/.5);g.globalAlpha=a;const cx=W/2;let y=vertical?H*.3:H*.24;
        txt(p.brand||p.name,cx,y,vertical?60:64,"#fff",800,"center");y+=vertical?60:58;
        if(p.location){txt(p.location,cx,y,28,"#d8d6d0",600,"center");y+=vertical?70:60}
        if(showPrices){for(const un of p.units.slice(0,3)){txt(`${un.type}  ·  ${un.m2||"?"} m²  ·  ${fmtTL(un.price)}`,cx,y,vertical?34:32,"#fff",700,"center");y+=vertical?54:48}}
        if(p.delivery){txt(p.delivery,cx,y+10,30,ACC,700,"center");y+=vertical?70:60}
        if(p.phone){g.fillStyle=ACC;const w=vertical?520:520,h=84;g.beginPath();g.roundRect?g.roundRect(cx-w/2,y,w,h,42):g.rect(cx-w/2,y,w,h);g.fill();g.font=`800 44px Archivo, Arial, sans-serif`;g.textAlign="center";g.fillStyle="#1a0e05";g.fillText(p.phone,cx,y+57)}
        g.globalAlpha=1;
      }
      onProgress(Math.min(1,t/seconds));
      if(t<seconds)requestAnimationFrame(draw);else resolve();
    }
    requestAnimationFrame(draw);
  });
  rec.stop();await done;
  const type=mime.split(";")[0];
  return new Blob(chunks,{type});
}

function aiErr(code,message){ const e=new Error(message); e.code=code; return e; }
function classifyAi(text,status){

}
async function toVertical(blob){
  const u=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
    const c=document.createElement("canvas");c.width=HF.W;c.height=HF.H;const g=c.getContext("2d");
    const r=Math.max(HF.W/img.width,HF.H/img.height);const w=img.width*r,h=img.height*r;

function verifyVideo(blob){
  return new Promise((res,rej)=>{
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="metadata";
    const u=URL.createObjectURL(blob);const done=(ok,val)=>{URL.revokeObjectURL(u);ok?res(val):rej(val)};
    const t=setTimeout(()=>done(false,aiErr("invalid_video","Gelen dosya oynatılabilir bir video olarak doğrulanamadı.")),15000);
    v.onloadedmetadata=()=>{clearTimeout(t);(isFinite(v.duration)&&v.duration>0)?done(true,{duration:v.duration,width:v.videoWidth,height:v.videoHeight}):done(false,aiErr("invalid_video","Gelen videonun süresi okunamadı."))};
    v.onerror=()=>{clearTimeout(t);done(false,aiErr("invalid_video","Gelen dosya bu cihazda oynatılamıyor."))};

async function hfImageToVideo({imageBlob,prompt,seconds,onStatus,signal}){
  const token=Token.get();
  if(!token) throw aiErr("no_token","Hugging Face anahtarı girilmedi. Servisler ekranından ekleyin.");
  const base=HF.base(), auth={Authorization:"Bearer "+token};
  let r;
  onStatus("upload");
  const fd=new FormData();fd.append("files",imageBlob,"kaynak.jpg");
  try{ r=await fetch(base+"/gradio_api/upload",{method:"POST",headers:auth,body:fd,signal}) }catch(e){ throw netErr(e) }
  if(!r.ok) throw classifyAi(await r.text().catch(()=>""),r.status);
  const paths=await r.json();
  const fileData={path:paths[0],orig_name:"kaynak.jpg",mime_type:"image/jpeg",meta:{_type:"gradio.FileData"}};
  const data=[prompt,NEG,fileData,null,HF.H,HF.W,"image-to-video",seconds,9,42,true,1.0,true];
  onStatus("queue");
  try{ r=await fetch(base+"/gradio_api/call/image_to_video",{method:"POST",headers:{...auth,"Content-Type":"application/json"},body:JSON.stringify({data}),signal}) }catch(e){ throw netErr(e) }
  if(!r.ok) throw classifyAi(await r.text().catch(()=>""),r.status);
  const {event_id}=await r.json();
  try{ r=await fetch(base+"/gradio_api/call/image_to_video/"+event_id,{headers:auth,signal}) }catch(e){ throw netErr(e) }
  if(!r.ok) throw classifyAi(await r.text().catch(()=>""),r.status);
  const reader=r.body.getReader(),dec=new TextDecoder();let buf="",result=null;
  while(true){
    let chunk; try{ chunk=await reader.read() }catch(e){ throw netErr(e) }
    if(chunk.done) break;
    buf+=dec.decode(chunk.value,{stream:true});
    let i;
    while((i=buf.indexOf("\n\n"))>=0){
      const block=buf.slice(0,i);buf=buf.slice(i+2);
      const ev=(block.match(/^event:\s*(.*)$/m)||[])[1];const dt=(block.match(/^data:\s*(.*)$/m)||[])[1];
      if(ev==="generating") onStatus("generating");
      else if(ev==="error") throw classifyAi(dt&&dt!=="null"?dt:"Space bir hata döndürdü (ayrıntı verilmedi; çoğunlukla kota dolduğunda olur).",0);
      else if(ev==="complete"){ result=JSON.parse(dt); }
    }
    if(result) break;
  }
  if(!result) throw aiErr("failed","Space sonuç göndermeden bağlantıyı kapattı. Hiçbir video üretilmedi.");
  const out=result[0]||{};const vid=out.video||out;
  const url=vid.url||(vid.path?base+"/gradio_api/file="+vid.path:"");
  if(!url) throw aiErr("failed","Space yanıtında video dosyası yok.");
  onStatus("download");
  try{ r=await fetch(url,{headers:auth,signal}) }catch(e){ throw netErr(e) }
  if(!r.ok) throw classifyAi("Video dosyası indirilemedi",r.status);
  const blob=await r.blob();
  if(!blob.size) throw aiErr("invalid_video","Boş video dosyası geldi.");
  onStatus("verify");
  const meta=await verifyVideo(blob);
  return {blob:new Blob([blob],{type:blob.type||"video/mp4"}),meta,seed:result[1]};
}


/* ------------------------------------------------------------------ AI film plan: same camera, chained clips */
const KEEP_SCENE="Completely static camera, same viewpoint, same plot boundaries, same neighboring buildings and minaret in the background. Fast construction timelapse: workers and machines move quickly, shadows and clouds sweep across. Photorealistic.";
const KEEP_BUILDING="Keep the building's shape, floor count, floor heights and window openings exactly the same.";
const FILM_STAGES=[

  {key:"found",title:"Temel",src:"chain",p:"Workers lay rebar mesh and formwork in the pit, a concrete mixer truck pours the foundation slab."},

  {key:"garden",title:"Bahçe düzenlemesi",src:"chain",p:"Debris is cleared, fresh lawn is rolled out, a black metal fence and garden lights are installed, small trees planted. "+"KB"},
  {key:"done",title:"Anahtar teslim",src:"chain",p:"The finished white building stands complete in a clean landscaped garden, light turns warm and the garden lights switch on. "+"KB"}
];
const PICK={30:["dig1","found","cols","walls","plaster","garden"],60:FILM_STAGES.map(s=>s.key)};
function filmPlan(p){
  const secs=p.aiFilmSeconds||60;
  let keys;
  if(secs===90){keys=[];FILM_STAGES.forEach((s,i)=>{keys.push(s.key);if(i%2===1)keys.push(s.key+"_b")})}
  else keys=PICK[secs]||PICK[60];
  return keys.map((k,i)=>{
    const base=FILM_STAGES.find(s=>s.key===k.replace(/_b$/,""));
    const extra=k.endsWith("_b");

    if(i===0&&src==="chain")src="empty";
    if(extra)src="chain";
    const promptText=(base.p+(extra?" The work continues further.":"")).replace("KB",p.type==="ongoing_construction"?KEEP_BUILDING:"")+" "+KEEP_SCENE;
    return {key:k,title:base.title+(extra?" (devam)":""),src,prompt:promptText.trim()};
  });
}

async function mergeClips(p,plan,onProgress){

    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(aiErr("clip","Bir klip açılamadı."))});vids.push(v)}
  const total=vids.reduce((a,v)=>a+v.duration,0)+END;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:6_000_000});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r);
  const ACC=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#e8661c";
  const draw=v=>{const r=Math.max(W/v.videoWidth,H/v.videoHeight);const w=v.videoWidth*r,h=v.videoHeight*r;g.drawImage(v,(W-w)/2,(H-h)/2,w,h)};
  const label=(t,a)=>{g.globalAlpha=a;g.fillStyle="rgba(0,0,0,.5)";g.fillRect(0,H-150,W,150);g.fillStyle="#fff";g.font="800 44px Archivo, Arial, sans-serif";g.textAlign="left";g.fillText(t,40,H-70);g.globalAlpha=1};
  rec.start(250);
  let elapsed=0;
  for(let i=0;i<vids.length;i++){
    const v=vids[i];v.currentTime=0;await v.play().catch(()=>{});
    await new Promise(res=>{
      const tick=()=>{
        draw(v);
        const nx=vids[i+1];
        if(nx&&v.duration-v.currentTime<XF){if(nx.paused){nx.currentTime=0;nx.play().catch(()=>{})}g.globalAlpha=1-(v.duration-v.currentTime)/XF;draw(nx);g.globalAlpha=1}
        label(plan[i].title,Math.min(1,v.currentTime/0.4));
        g.fillStyle=ACC;g.fillRect(0,0,W*((elapsed+v.currentTime)/total),8);
        onProgress((elapsed+v.currentTime)/total);
        if(v.ended||v.currentTime>=v.duration-0.02)res();else requestAnimationFrame(tick);
      };requestAnimationFrame(tick);
    });
    elapsed+=v.duration;
  }
  const last=vids[vids.length-1];const t0=performance.now();
  await new Promise(res=>{const tick=()=>{const t=(performance.now()-t0)/1000;draw(last);g.fillStyle=`rgba(14,16,20,${Math.min(.82,t/.6)})`;g.fillRect(0,0,W,H);g.textAlign="center";g.fillStyle="#fff";
    g.font="800 54px Archivo, Arial, sans-serif";g.fillText(p.brand||p.name,W/2,H*.38);g.font="600 30px Archivo, Arial, sans-serif";if(p.location)g.fillText(p.location,W/2,H*.38+56);
    if(p.delivery){g.fillStyle=ACC;g.fillText(p.delivery,W/2,H*.38+120)}
    if(p.phone){g.fillStyle=ACC;g.fillRect(W/2-250,H*.56,500,84);g.fillStyle="#1a0e05";g.font="800 44px Archivo, Arial, sans-serif";g.fillText(p.phone,W/2,H*.56+57)}
    onProgress(Math.min(1,(elapsed+t)/total));if(t<END)requestAnimationFrame(tick);else res()};requestAnimationFrame(tick)});
  rec.stop();await stopped;
  const blob=new Blob(chunks,{type:mime.split(";")[0]});
  const meta=await verifyVideo(blob);
  return {blob,meta};
}

  return html`<div class="card stack"><h3>Hugging Face anahtarı</h3>
    <p class="muted" style="font-size:.9rem">Anahtar yalnızca bu telefonda saklanır. Koda, GitHub deposuna veya proje kaydına yazılmaz; yalnızca Hugging Face’e gönderilir. “Read” yetkili anahtar yeterlidir; istediğiniz an Hugging Face’ten silebilirsiniz.</p>
    ${m?html`<div class="row"><span class="mono grow">${m}</span><button onClick=${()=>{Token.set("");setM("")}}>Anahtarı sil</button></div>`
      :html`<label class="f">Anahtar (hf_ ile başlar)<input id="hf-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value=${v} onInput=${e=>setV(e.target.value.trim())}/></label>
        <button class="primary block" disabled=${!/^hf_[A-Za-z0-9]{20,}$/.test(v)} onClick=${()=>{Token.set(v);setV("");setM(Token.masked())}}>Anahtarı kaydet</button>
        <a class="muted" href=${HF.tokensPage} target="_blank" rel="noopener" style="font-size:.88rem">Anahtar oluşturma sayfası: huggingface.co/settings/tokens</a>`}
  </div>`;
}
function Services(){
  const mime=pickMime();
  let lastOk=null;try{lastOk=localStorage.getItem("bv_hf_last_ok")}catch(e){}
  const rows=[
    ["Proje kaydı",Store.mode==="cloud"?["ok","Bulutta, kalıcı"]:Store.mode==="device"?["ok","Bu cihazda, kalıcı"]:["bad","Geçici (kaydedilmez)"],"Projeler uygulama kapanınca kaybolmaz."],
    ["Fotoğraf deposu",Store.canUpload?["ok","Hazır"]:["bad","İzin yok"],"Fotoğraflar 1600 px JPEG olarak saklanır."],
    ["Mimari analiz (Claude)",Store.sample?["ok","Bağlı · ücretsiz"]:["warn","Yok · yerel kontrol"],"Fotoğrafları inceler, kat sayısını karşılaştırır, eksikleri listeler."],
    ["AI görsel üretimi",IN_CLAUDE?["bad","Bu görünümde engelli"]:["warn","İsteğe bağlı · ücretsiz kota"],IN_CLAUDE?"claude.ai harici bağlantıya izin vermiyor. Kendi adresinde çalışan PWA sürümünde isteğe bağlı açılır.":"Anahtarsız ücretsiz servis; kota dolunca durur, ücretli işleme geçmez. Binayı birebir korumayabilir."],
    ["AI video üretimi (Hugging Face)",IN_CLAUDE?["bad","Bu görünümde engelli"]:!Token.get()?["warn","Anahtar gerekli"]:lastOk?["ok","Son test başarılı"]:["warn","Bağlı · henüz test edilmedi"],IN_CLAUDE?"claude.ai dış servislere bağlantıya izin vermiyor. PWA sürümünde çalışır.":"Model: "+HF.model+". Ücretsiz hesapla günde 5 GPU dakikası; kota dolunca durur, ücret alınmaz."],
    ["Video kurgu (cihazda)",mime?["ok",mime.includes("mp4")?"MP4":"WebM"]:["bad","Desteklenmiyor"],"Aşama görsellerinden geçişli, yazılı video hazırlar."],
    ["Telefona indirme",Store.canDownload?["ok","Hazır"]:["bad","İzin yok"],"Kaydet dediğinizde onay sorulur."],
  ];
  return html`<div class="stack">
    <div class="stack" style="gap:6px;padding-top:6px"><span class="eyebrow">Bağlantılar</span><h1>Servis durumu</h1>
      <p class="muted">Hiçbir özellik ücretli servis gerektirmez. Kullanılamayanlar açıkça işaretlidir.</p></div>
    <div class="card">${rows.map(([n,[k,l],d])=>html`<div class="svc" key=${n}><span style="font-weight:600">${n}</span><${Chip} kind=${k}>${l}<//><span class="muted" style="grid-column:1/-1;font-size:.88rem">${d}</span></div>`)}</div>
    <${TokenCard}/>
    <div class="card stack"><h3>Ana ekrana ekleme</h3>
      <p class="muted" style="font-size:.92rem">${IN_CLAUDE?"Bu sürüm claude.ai içinde çalışır ve gerçek PWA olarak kurulamaz. Ana ekrandan açılan uygulama için aynı dosyanın PWA paketi ücretsiz bir adreste yayınlanmalıdır.":"Safari’de Paylaş → “Ana Ekrana Ekle”."}</p></div>
  </div>`;
}

/* ------------------------------------------------------------------ error boundary: a failing screen never blanks the whole app */
class Guard extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return {err}}
  componentDidCatch(err){try{console.error("BuildVision ekran hatası:",err)}catch(e){}}
  render(){
    if(this.state.err)return html`<div class="notice bad stack" style="gap:10px"><strong>Bu bölüm açılamadı.</strong><span style="font-size:.88rem">${String(this.state.err&&this.state.err.message||this.state.err)}</span><button onClick=${()=>this.setState({err:null})}>Tekrar dene</button></div>`;
    return this.props.children;
  }
}
/* ------------------------------------------------------------------ app shell */
function App(){
  const [ready,setReady]=useState(false),[projects,setProjects]=useState([]),[loadErr,setLoadErr]=useState(null);
  const [openId,setOpenId]=useState(null),[tab,setTab]=useState("info"),[view,setView]=useState("home");
  const [toastMsg,toast]=useToast();
  const [showNew,setShowNew]=useState(false);
  const pending=useRef({}),timers=useRef({});
  useEffect(()=>{let unsub;Store.init().then(()=>{setReady(true);unsub=Store.subscribe((list,e)=>{if(e){setLoadErr("Projeler yüklenemedi: "+(e.message||e.code));return}
    setProjects(list.map(x=>pending.current[x.id]||x).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")))})});return()=>unsub&&unsub()},[]);
  const update=useCallback(np=>{
    pending.current[np.id]=np;
    setProjects(ps=>ps.map(x=>x.id===np.id?np:x));
    clearTimeout(timers.current[np.id]);
    timers.current[np.id]=setTimeout(async()=>{try{await Store.save(np)}catch(e){toast("Kaydedilemedi: "+(e.message||e.code))}finally{if(pending.current[np.id]===np)delete pending.current[np.id]}},600);
  },[toast]);
  async function create(name,type){const p=newProject(name,type);setProjects(ps=>[p,...ps]);try{await Store.save(p)}catch(e){toast("Kaydedilemedi")}setOpenId(p.id);setTab("photos");setView("home")}
  const p=projects.find(x=>x.id===openId);
  const TABS=[["info","Bilgi"],["photos","Fotoğraflar"],["design","Tasarım"],["stages","Aşamalar"],["video","Video"]];
  return html`<div>
    <header class="top">
      ${p&&view==="home"?html`<button class="icon ghost" aria-label="Projelere dön" onClick=${()=>setOpenId(null)}>${I.back}</button>
        <div class="grow"><span class="eyebrow">${p.type==="empty_plot"?"Boş arsa":"Devam eden inşaat"}${p.plotM2?" · "+p.plotM2+" m²":""}</span><h2 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</h2></div>`
      :html`<div class="brandmark grow"><div class="logo">BV</div><div><h3>BuildVision AI</h3><span class="muted" style="font-size:.78rem">${Store.mode==="cloud"?"Bulut kaydı":Store.mode==="device"?"Cihaz kaydı":"Yükleniyor"}</span></div></div>`}
    </header>
    ${!ready?html`<p class="muted">Hazırlanıyor…</p>`:loadErr?html`<div class="notice bad">${loadErr}</div>`:
      view==="services"?html`<${Guard}><${Services}/><//>`:
      p?html`<div class="stack">
        <div class="tabs" role="tablist">${TABS.map(([k,l])=>html`<button role="tab" aria-selected=${tab===k} onClick=${()=>setTab(k)} key=${k}>${l}</button>`)}</div>
        ${tab==="info"&&html`<${Guard} key=${"g-"+tab}><${InfoTab} p=${p} update=${update}/><//>`}
        ${tab==="photos"&&html`<${Guard} key=${"g-"+tab}><${PhotosTab} p=${p} update=${update} toast=${toast}/><//>`}
        ${tab==="design"&&html`<${Guard} key=${"g-"+tab}><${DesignTab} p=${p} update=${update} toast=${toast}/><//>`}
        ${tab==="stages"&&html`<${Guard} key=${"g-"+tab}><${StagesTab} p=${p} update=${update} toast=${toast} go=${setTab}/><//>`}
        ${tab==="video"&&html`<${Guard} key=${"g-"+tab}><${VideoTab} p=${p} update=${update} toast=${toast}/><//>`}
      </div>`:html`<${ProjectList} projects=${projects} open=${id=>{setOpenId(id);setTab("info")}} create=${create} show=${showNew} setShow=${setShowNew}/>`}
    <nav class="bottom">
      <button aria-current=${view==="home"&&!p?"page":undefined} onClick=${()=>{setView("home");setOpenId(null)}}>${I.home}Projeler</button>
      <button onClick=${()=>{setView("home");setOpenId(null);setShowNew(true)}} aria-label="Yeni proje" style=${{color:"var(--accent)"}}>${I.plus}Yeni</button>
      <button aria-current=${view==="services"?"page":undefined} onClick=${()=>setView("services")}>${I.plug}Servisler</button>
    </nav>
    ${toastMsg&&html`<div class="toast" role="status">${toastMsg}</div>`}
  </div>`;
}
window.__bvStarted=true;
ReactDOM.createRoot(document.getElementById("root")).render(html`<${Guard}><${App}/><//>`);
</script>

<script>
if("serviceWorker" in navigator && location.protocol==="https:" && !(window.claude&&window.claude.use)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
